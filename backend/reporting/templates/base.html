<!DOCTYPE html>

<head>

    <title>{{ report.title | default("Vulnerability Scan Report") }}</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="page-header">
        <div class="header-left logo">GovernExa</div>
        <div class="header-center">Vulnerability Scan Report</div>
        <div class="header-right confidential">CONFIDENTIAL – INTERNAL SECURITY DOCUMENT</div>
    </div>

        <div class="footer-right confidential">CONFIDENTIAL</div>

    <div class="content">

</html>
